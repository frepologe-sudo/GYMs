var PINFO={
press:{t:'Drück-Bewegung (Brust)',s:['Lege dich flach auf die Bank, Füße fest am Boden, Schulterblätter zusammen und leicht nach unten ziehen.','Greife das Gewicht etwa schulterbreit bis etwas weiter und bringe es kontrolliert über die Brust.','Senke es langsam zur Brustmitte, die Ellbogen etwa 45–60° vom Körper.','Drücke kräftig nach oben, ohne das Gesäß von der Bank zu heben.'],k:'Handgelenke gerade halten, Brust raus, unten nicht abfedern.'},
pulldown:{t:'Zug von oben (Latzug / Klimmzug)',s:['Greife etwas weiter als schulterbreit und setze dich stabil hin (Oberschenkel unter dem Polster).','Brust leicht raus, Schulterblätter nach hinten unten ziehen.','Ziehe die Stange zur oberen Brust, Ellbogen zeigen nach unten.','Lass kontrolliert nach oben, bis die Arme fast gestreckt sind.'],k:'Nicht mit Schwung aus dem Rücken lehnen, Zug kommt aus dem Rücken, nicht aus den Armen.'},
row:{t:'Rudern (Zug zur Körpermitte)',s:['Sitze oder stehe stabil, Rücken gerade, Brust offen.','Ziehe den Griff zum Bauch, Ellbogen eng am Körper nach hinten.','Drücke die Schulterblätter am Ende kurz zusammen.','Gib das Gewicht langsam wieder nach vorn, ohne den Rücken zu runden.'],k:'Oberkörper möglichst ruhig halten, kein Hohlkreuz.'},
curl:{t:'Curl (Bizeps / Unterarm)',s:['Stehe aufrecht, Ellbogen fest an der Seite, Griff fest.','Beuge die Arme und bringe das Gewicht kontrolliert Richtung Schulter.','Spanne oben kurz an.','Senke langsam bis die Arme fast gestreckt sind.'],k:'Ellbogen nicht nach vorn wandern lassen, nicht mit dem Rücken schwingen.'},
ohp:{t:'Überkopf-Drücken (Schulter)',s:['Stehe oder sitze stabil, Bauch und Gesäß angespannt.','Gewicht auf Schulterhöhe, Unterarme senkrecht.','Drücke es senkrecht über den Kopf, bis die Arme fast gestreckt sind.','Senke kontrolliert zurück zur Schulter.'],k:'Kein Hohlkreuz, Kopf leicht nach hinten ausweichen lassen, dann wieder unter die Stange.'},
tri:{t:'Trizeps-Streckung',s:['Ellbogen eng am Kopf bzw. Körper, Oberarm bleibt ruhig.','Senke das Gewicht kontrolliert durch Beugen im Ellbogen.','Strecke die Arme kraftvoll bis fast durch.','Spanne oben kurz an und gehe langsam zurück.'],k:'Nur der Unterarm bewegt sich, Ellbogen nicht aufklappen.'},
lat:{t:'Heben (seitlich / nach vorn / hinten)',s:['Stehe stabil, leichte Beugung in den Ellbogen.','Hebe die Arme kontrolliert bis etwa Schulterhöhe.','Halte oben kurz an.','Senke langsam ab, ohne Schwung aus dem Körper.'],k:'Lieber leichter und sauber, Schultern nicht zu den Ohren hochziehen.'},
squat:{t:'Kniebeuge / Beinpresse-Muster',s:['Fuß etwa schulterbreit, Zehen leicht nach außen, Rumpf angespannt.','Beuge Knie und Hüfte gleichzeitig, Gesäß nach hinten unten.','Gehe so tief, wie du den Rücken gerade halten kannst, Knie in Richtung Zehen.','Drücke dich über die ganze Fußsohle nach oben.'],k:'Knie nicht nach innen fallen lassen, Fersen bleiben am Boden.'},
hinge:{t:'Hüftbeuge (Kreuzheben-Muster)',s:['Stehe hüftbreit, Gewicht nah am Körper, Rücken gerade, Brust offen.','Schiebe die Hüfte nach hinten, Oberkörper kippt nach vorn, Knie leicht gebeugt.','Spanne den Rücken an und richte dich durch Hüftstreckung auf.','Oben Gesäß anspannen, nicht ins Hohlkreuz überstrecken.'],k:'Das Gewicht bleibt ganz nah am Körper, der Rücken bleibt immer gerade.'},
thrust:{t:'Hüftstoß (Gesäß)',s:['Oberer Rücken liegt auf der Bank, Füße hüftbreit fest am Boden.','Drücke die Hüfte nach oben, bis Oberkörper und Oberschenkel eine Linie bilden.','Spanne das Gesäß oben 1 Sekunde an.','Senke die Hüfte kontrolliert ab.'],k:'Kinn leicht zur Brust, nicht ins Hohlkreuz drücken.'},
crunch:{t:'Bauchübung (Crunch)',s:['Lege dich auf den Rücken, Knie angewinkelt, Füße am Boden.','Hände seitlich am Kopf, nicht am Nacken ziehen.','Rolle den Oberkörper nur wenige Zentimeter ein, Bauch fest anspannen.','Langsam ablegen, Spannung halten.'],k:'Kurze, saubere Bewegung, Bauchspannung geht vor Höhe.'},
shrug:{t:'Schulterheben (Trapez)',s:['Stehe aufrecht, Gewichte hängen seitlich am Körper.','Ziehe die Schultern gerade senkrecht Richtung Ohren.','Halte oben 1 Sekunde.','Senke langsam ab.'],k:'Nicht die Schultern kreisen lassen.'},
flym:{t:'Butterfly (sitzend an der Maschine)',s:['Stelle den Sitz so ein, dass die Griffe/Polster auf Brusthöhe sind, Rücken fest an der Lehne.','Unterarme an die Polster legen oder Griffe greifen, Ellbogen leicht gebeugt, Schultern unten.','Führe die Arme in einem Bogen vor der Brust zusammen und spanne die Brust an.','Öffne kontrolliert wieder, bis du eine Dehnung in der Brust spürst.'],k:'Nicht mit Schwung arbeiten, Schultern nicht nach vorn rollen, Rücken bleibt an der Lehne.'},
flyc:{t:'Fliegende am Kabelzug',s:['Stelle dich mittig zwischen die Kabel, ein Fuß leicht vor, Oberkörper stabil.','Arme seitlich mit leicht gebeugten Ellbogen, Griffe auf Schulterhöhe.','Ziehe die Hände in einem Bogen vor dem Körper zusammen und spanne die Brust an.','Lass langsam wieder auseinander gehen.'],k:'Ellbogenwinkel bleibt gleich, die Bewegung kommt aus der Schulter.'},
legcurl:{t:'Beinbeuger (Maschine)',s:['Stelle die Polster so ein, dass sie knapp über den Fersen liegen.','Sitze oder liege fest, Hüfte bleibt unten.','Beuge die Knie und ziehe die Fersen Richtung Gesäß.','Lass kontrolliert wieder strecken.'],k:'Nicht mit dem Becken nachhelfen, oben kurz halten.'},
legext:{t:'Beinstrecker (Maschine)',s:['Rücken an die Lehne, Polster knapp über den Knöcheln.','Strecke beide Beine kraftvoll bis fast durch.','Spanne den Oberschenkel oben kurz an.','Senke langsam ab.'],k:'Knie nicht durchschlagen, Gewicht kontrolliert bewegen.'},
legpress:{t:'Beinpresse',s:['Setze dich zurückgelehnt hin, Füße etwa schulterbreit auf die Platte.','Löse die Sicherung und senke die Platte, bis die Knie etwa 90° gebeugt sind.','Drücke kräftig über die ganze Fußsohle weg, ohne die Knie ganz durchzudrücken.','Rücken und Gesäß bleiben fest am Polster.'],k:'Knie zeigen in Richtung Zehen, Becken nicht abheben.'},
pullup:{t:'Klimmzug',s:['Greife die Stange etwas weiter als schulterbreit, hänge mit gestreckten Armen.','Ziehe die Schulterblätter nach unten hinten.','Ziehe dich hoch, bis das Kinn über der Stange ist.','Senke dich kontrolliert wieder ab.'],k:'Kein Schwung aus den Beinen, voller Bewegungsradius.'},
abd:{t:'Abduktoren (Maschine)',s:['Setze dich aufrecht, Beine an die Polster außen.','Drücke die Beine kontrolliert nach außen auseinander.','Halte kurz die Spannung am Gesäß.','Führe langsam zurück.'],k:'Oberkörper ruhig lassen.'},
add:{t:'Adduktoren (Maschine)',s:['Setze dich aufrecht, Beine an die Polster innen.','Drücke die Beine kontrolliert zusammen.','Halte kurz die Spannung an der Innenseite der Oberschenkel.','Lass langsam wieder öffnen.'],k:'Nicht mit Schwung zusammenschlagen.'},
dips:{t:'Dips',s:['Stütze dich an den Holmen ab, Arme gestreckt, Körper leicht nach vorn geneigt.','Beuge die Ellbogen und senke dich ab, bis die Oberarme etwa waagerecht sind.','Drücke dich kräftig wieder nach oben.','Oben die Arme fast durchstrecken.'],k:'Schultern unten halten, nicht zu tief abkippen.'},
run:{t:'Cardio / Ganzkörper',s:['Starte locker und steigere die Intensität langsam.','Halte eine aufrechte Haltung, Schultern entspannt.','Atme gleichmäßig und halte ein Tempo, bei dem du noch kurz sprechen kannst.'],k:'Wärme dich vorher kurz auf.'},
calf:{t:'Wadenheben',s:['Stehe mit den Fußballen auf der Kante, Fersen frei.','Drücke dich möglichst hoch auf die Zehenspitzen.','Halte oben 1 Sekunde.','Senke die Ferse langsam unter die Kante.'],k:'Voller Bewegungsradius, nicht federn.'}};

function codeCard(){var c=null,t='';try{c=localStorage.getItem('gt_code')}catch(e){}return'<div class="c"><div class="lb">App-Code ersetzen</div><div class="m">'+(c?'Eigener Code aktiv ('+Math.round(c.length/1024)+' KB). ':'Es läuft der eingebaute Code. ')+'Hier kannst du eine neue Version der App einspielen: Datei wählen oder kompletten Code einfügen. Bei einem Fehler startet nach zwei misslungenen Versuchen automatisch wieder der Original-Code. Notfall: <b>#safe</b> an die Adresse hängen.</div><textarea id="cdt" rows="4" placeholder="Kompletten HTML-Code hier einfügen …"></textarea><div class="r"><button class="o" data-a="codefile">Datei wählen</button><button class="b" data-a="codeins">Installieren</button></div>'+(c?'<div class="r"><button class="o" style="color:#ef6a5a" data-a="codereset">Zurück zum Original</button></div>':'')+'</div>'}
function codeInstall(h){h=String(h||'');if(h.length<5000||!/<html/i.test(h)||!/<\/script>/i.test(h)){toast('Das sieht nicht nach einer kompletten App aus');return}try{localStorage.setItem('gt_code',h);localStorage.removeItem('gt_try')}catch(e){toast('Speicher voll – Code zu groß');return}toast('Installiert – lade neu …');setTimeout(function(){location.reload()},700)}
document.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;var a=b.getAttribute('data-a');if(a!=='codeins'&&a!=='codefile'&&a!=='codereset')return;e.stopPropagation();if(a==='codeins'){codeInstall((document.getElementById('cdt')||{}).value)}else if(a==='codefile'){var i=document.getElementById('cdf');if(!i){i=document.createElement('input');i.type='file';i.id='cdf';i.accept='.html,text/html,text/plain';i.hidden=true;document.body.appendChild(i);i.addEventListener('change',function(){var f=i.files[0];if(!f)return;var r=new FileReader();r.onload=function(){codeInstall(r.result)};r.readAsText(f);i.value=''})}i.click()}else{try{localStorage.removeItem('gt_code');localStorage.removeItem('gt_try')}catch(x){}toast('Original-Code aktiv – lade neu …');setTimeout(function(){location.reload()},700)}},true);

/* Pläne aus Workouts */
function lastWo(n){return S.w.filter(function(w){return w.p===n}).sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:(a.t||0)-(b.t||0)}).pop()}
function exOf(w){var o=[];w.ex.forEach(function(e){if(o.indexOf(e.n)<0)o.push(e.n)});return o}
function missPl(){var o={},r=[];S.w.forEach(function(w){if(o[w.p])return;o[w.p]=1;if(pl(w.p))return;var l=lastWo(w.p);if(l&&l.ex.length>1)r.push(w.p)});return r}
function mkPlans(){var m=missPl();m.forEach(function(n){S.plans.push({n:n,e:exOf(lastWo(n)),c:PAL[S.plans.length%PAL.length]})});return m.length}
function planFromW(id){var w=S.w.filter(function(x){return x.id===id})[0];if(!w)return;var p=pl(w.p),e=exOf(w);if(p){p.e=e;toast('Plan „'+w.p+'“ aktualisiert')}else{S.plans.push({n:w.p,e:e,c:PAL[S.plans.length%PAL.length]});toast('Als Plan „'+w.p+'“ gespeichert')}save();render()}
function plCard(){var m=missPl();return m.length?'<div class="c"><div class="lb">Pläne aus deinen Workouts</div><div class="m">Noch kein Plan für: '+m.map(esc).join(', ')+'</div><div class="r"><button class="b" data-a="mkpl">Pläne automatisch anlegen</button></div></div>':''}
document.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;var a=b.getAttribute('data-a');if(a!=='mkpl'&&a!=='pfw')return;e.stopPropagation();if(a==='mkpl'){var n=mkPlans();save();render();toast(n+' Pläne angelegt')}else planFromW(b.getAttribute('data-id'))},true);

render()})();
